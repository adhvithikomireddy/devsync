version: '3.8'

services:
  devsync:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devsync-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/devsync
      - JWT_SECRET=devsync_production_super_secret_jwt_key_2026
      - CLIENT_URL=http://localhost:5000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0
    container_name: devsync-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - devsync_mongo_data:/data/db

volumes:
  devsync_mongo_data:
